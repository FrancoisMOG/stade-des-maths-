<style>
/* Stade : pelouse tondue en bandes, lignes blanches, tableau d'affichage, maillots aux couleurs des domaines. */
:root{
  --grass1:#e3f1dc;--grass2:#d6eacd;--pitch:#1d7a3c;--pitch-d:#155c2c;--line:#cfe0c8;--grid2:#c3d6bc;
  --card:#ffffff;--paper:#f3f9f0;--ink:#13261a;--muted:#4f6656;
  --board:#0f1d15;--board-ink:#ffd23f;--board-soft:#26392d;
  --blue:#1d7a3c;--blue-soft:#e3f2e6;--margin:#e23b3f;--hl:#ffcf33;--on-hl:#1d1a05;
  --ok:#14915a;--ok-soft:#dcf4e7;--ko:#d1611a;--ko-soft:#fde8d8;
  --d-nb:#2563eb;--d-gm:#e5740c;--d-geo:#c2185b;--d-don:#7c3aed;
  --iso1:#ffe28a;--iso2:#9fd1ad;--iso3:#c9e6d0;
  --font-d:'Bebas Neue','Impact','Arial Narrow',sans-serif;--font-b:'Nunito','Segoe UI',system-ui,sans-serif;--font-m:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --grass1:#0c2215;--grass2:#0f2819;--pitch:#4fd07e;--pitch-d:#2f9e57;--line:#24402e;--grid2:#2c4a37;
  --card:#12261a;--paper:#0d1e14;--ink:#e6f3ea;--muted:#9ab8a3;
  --board:#06100a;--board-ink:#ffd23f;--board-soft:#1b2e22;
  --blue:#4fd07e;--blue-soft:#183a26;--margin:#ff6b6e;--hl:#f2c230;--on-hl:#1d1a05;
  --ok:#41d08c;--ok-soft:#133526;--ko:#ff9d5c;--ko-soft:#3a2514;
  --d-nb:#6f9bff;--d-gm:#ffa04a;--d-geo:#ff6aa6;--d-don:#b38cff;
  --iso1:#6e5f1c;--iso2:#22603a;--iso3:#1a4a2c;color-scheme:dark}}
:root[data-theme="dark"]{
  --grass1:#0c2215;--grass2:#0f2819;--pitch:#4fd07e;--pitch-d:#2f9e57;--line:#24402e;--grid2:#2c4a37;
  --card:#12261a;--paper:#0d1e14;--ink:#e6f3ea;--muted:#9ab8a3;
  --board:#06100a;--board-ink:#ffd23f;--board-soft:#1b2e22;
  --blue:#4fd07e;--blue-soft:#183a26;--margin:#ff6b6e;--hl:#f2c230;--on-hl:#1d1a05;
  --ok:#41d08c;--ok-soft:#133526;--ko:#ff9d5c;--ko-soft:#3a2514;
  --d-nb:#6f9bff;--d-gm:#ffa04a;--d-geo:#ff6aa6;--d-don:#b38cff;
  --iso1:#6e5f1c;--iso2:#22603a;--iso3:#1a4a2c;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--grass1);background-image:repeating-linear-gradient(180deg,var(--grass1) 0 64px,var(--grass2) 64px 128px);color:var(--ink);font:600 16px/1.5 var(--font-b);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
/* tableau d'affichage */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);color:#fff;border-bottom:4px solid var(--hl);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:8px;font:400 26px/1 var(--font-d);letter-spacing:.03em;background:none;border:0;padding:0;color:#fff}
.brand svg{width:34px;height:34px}
.sp{flex:1}
.score{display:flex;align-items:baseline;gap:6px;border-radius:8px;padding:4px 10px;background:var(--board-soft);font:400 26px/1 var(--font-d);color:var(--board-ink);letter-spacing:.06em;font-variant-numeric:tabular-nums;text-shadow:0 0 8px color-mix(in srgb,var(--board-ink) 55%,transparent)}
.score small{font:800 11px var(--font-b);color:#cfd8d2;letter-spacing:.08em;text-shadow:none}
.icon-btn{width:38px;height:38px;border-radius:10px;border:2px solid var(--board-soft);background:var(--board-soft);color:#fff;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.back{border:2px solid var(--line);background:var(--card);border-radius:12px;height:38px;padding:0 12px;font-weight:800;display:flex;align-items:center;gap:6px}
main{max-width:780px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-d);font-weight:400;margin:0;text-wrap:balance;line-height:1;letter-spacing:.02em}
h1{font-size:clamp(34px,8vw,44px)}h2{font-size:28px}h3{font-size:22px}
.muted{color:var(--muted)}
.hello{display:flex;gap:14px;align-items:center}
.hello .mascot{width:84px;height:84px;flex:none}
.hello p{margin:4px 0 0}
.hello h1{font-size:clamp(30px,7vw,40px)}
#pseudo{font:inherit;color:var(--pitch);border:0;border-bottom:3px dashed var(--pitch);background:transparent;width:6.5em;max-width:44vw;padding:0 2px;letter-spacing:.02em}
#pseudo::placeholder{color:var(--muted);opacity:.7}
.sport{display:flex;gap:0;border:2px solid var(--ink);border-radius:999px;overflow:hidden;width:max-content;margin-top:8px;background:var(--card)}
.sport button{border:0;background:none;padding:6px 14px 6px 10px;font-weight:900;font-size:14px;display:flex;align-items:center;gap:6px}
.sport button svg{width:22px;height:22px}
.sport button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px}
.level{padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.jersey-badge{grid-row:span 2;width:62px;height:58px}
.bar{height:12px;border-radius:99px;background:var(--blue-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--pitch) 0 10px,var(--pitch-d) 10px 20px);border-radius:99px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:10px 12px}
.stat b{display:block;font:400 32px/1 var(--font-d);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.stat span{font-size:13px;color:var(--muted);font-weight:800}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 18px 9px;font:400 22px/1 var(--font-d);letter-spacing:.04em;background:var(--pitch);color:#fff;box-shadow:0 4px 0 var(--pitch-d);transition:transform .08s}
:root[data-theme="dark"] .btn:not(.ghost):not(.hl){color:#06100a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.hl){color:#06100a}}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pitch-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.hl{background:var(--hl);color:var(--on-hl);box-shadow:0 4px 0 color-mix(in srgb,var(--hl) 55%,#000)}
.btn[disabled]{opacity:.5;pointer-events:none}
.doms{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--card)}
.dom-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.dom-h::before{content:"";width:16px;height:16px;border-radius:4px;background:var(--c)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.th{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px;text-align:left;align-items:start;transition:transform .12s,border-color .12s}
.th:hover{border-color:var(--c);transform:translateY(-2px)}
.jersey{grid-row:span 3;width:58px;height:54px;flex:none}
.jersey path{fill:var(--c)}.jersey .col{fill:none;stroke:var(--card);stroke-width:2.5;opacity:.85}
.jersey text{fill:#fff;font:800 13px var(--font-b);letter-spacing:-.02em}
.th h3{font-size:22px}
.th p{margin:0;font-size:13px;color:var(--muted);line-height:1.3;font-weight:700}
.mini{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.mini .bar{flex:1;height:8px}.mini .bar>i{background:var(--c)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{padding:10px;display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.25;font-weight:700}
.badge .medal{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:400 17px var(--font-d);background:var(--hl);color:var(--on-hl);border:3px solid color-mix(in srgb,var(--hl) 60%,#000)}
.badge.off{opacity:.45}.badge.off .medal{background:var(--line);border-color:var(--line);color:var(--muted)}
.badge b{display:block;font-size:14px;font-weight:900}
.thead{display:flex;gap:14px;align-items:center}
.thead .jersey{width:76px;height:70px}
.tip{padding:12px 14px;border-left:5px solid var(--hl);border-radius:4px 14px 14px 4px;background:var(--card);border-top:2px solid var(--line);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
.tip b{font-family:var(--font-d);font-weight:400;font-size:20px;letter-spacing:.03em;color:var(--pitch)}
.lvl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.tile{aspect-ratio:1;max-width:100%;border-radius:8px;border:2px solid var(--line);background:var(--card);font:400 18px/1 var(--font-d);display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.tile.s3{background:var(--ok);border-color:var(--ok);color:var(--card)}
.tile.s2{background:color-mix(in srgb,var(--ok) 55%,var(--card));border-color:var(--ok)}
.tile.s1{background:var(--hl);border-color:color-mix(in srgb,var(--hl) 60%,#000);color:var(--on-hl)}
.tile.sv{background:var(--ko-soft);border-color:var(--ko);color:var(--ko)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:800;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px;border:2px solid var(--line)}
.exhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:13px;font-weight:900;border-radius:999px;padding:3px 10px;border:2px solid var(--line);background:var(--card)}
.tag.l0{color:var(--ok);border-color:var(--ok)}.tag.l1{color:var(--d-gm);border-color:var(--d-gm)}.tag.l2{color:var(--margin);border-color:var(--margin)}
/* fiche = tableau tactique */
.sheet{position:relative;padding:22px 18px 18px;border-radius:16px;overflow:hidden}
.sheet::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:repeating-linear-gradient(90deg,var(--pitch) 0 18px,var(--card) 18px 26px)}
.exnum{font:400 22px/1 var(--font-d);letter-spacing:.04em;color:var(--pitch);margin-bottom:8px}
.q{font-size:18px;line-height:1.55}
.say{font:800 19px var(--font-b);color:var(--pitch);margin:10px 0;padding:8px 12px;background:var(--blue-soft);border-radius:12px;overflow-wrap:anywhere}
.cap{font-weight:900;font-size:14px;color:var(--muted);margin-bottom:4px}
.fig{margin:14px 0 4px;overflow-x:auto}
.fig svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.ln{stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.shapef{fill:color-mix(in srgb,var(--pitch) 14%,transparent)}
.tk{stroke:var(--ink);stroke-width:1.3}.tk2{stroke:var(--margin);stroke-width:2.2}
.rm{fill:none;stroke:var(--margin);stroke-width:1.8}
.ray{stroke:var(--d-nb);stroke-width:3;stroke-linecap:round}
.arc{fill:none;stroke:var(--margin);stroke-width:2.2}
.dash{stroke:var(--margin);stroke-width:2.4;stroke-dasharray:7 5}
.gl{stroke:var(--grid2);stroke-width:1}
.pt{fill:var(--d-nb)}.pt2{fill:var(--card);stroke:var(--ink);stroke-width:2}
.shade{fill:var(--hl)}.cellb{fill:none;stroke:var(--ink);stroke-width:2}
.lbl{fill:var(--ink);font:800 15px var(--font-b)}.lblA{fill:var(--margin);font:900 16px var(--font-b)}.lbls{fill:var(--muted);font:800 13px var(--font-b)}.tiny{fill:var(--muted);font:800 10px var(--font-b)}
.prot{fill:var(--blue-soft);stroke:var(--ink);stroke-width:1.5}
.ruler{fill:var(--hl);opacity:.55;stroke:var(--ink);stroke-width:1}
.iso1{fill:var(--iso1);stroke:var(--ink);stroke-width:1.6}.iso2{fill:var(--iso2);stroke:var(--ink);stroke-width:1.6}.iso3{fill:var(--iso3);stroke:var(--ink);stroke-width:1.6}.isl{stroke:var(--ink);stroke-width:.8;opacity:.6}
.vbar{fill:var(--pitch)}.axis{stroke:var(--ink);stroke-width:1.6}.curve{fill:none;stroke:var(--margin);stroke-width:2.6;stroke-linejoin:round}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .15em;font-weight:900}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em}
.ang{display:inline-block;border-top:2px solid currentColor;border-radius:50% 50% 0 0/7px 7px 0 0;padding:1px 1px 0;line-height:1.1}
mark{background:var(--hl);color:var(--on-hl);border-radius:4px;padding:0 2px}
.nb{font-family:var(--font-m);font-size:.95em}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{border-collapse:collapse;font-variant-numeric:tabular-nums;margin:0 auto;background:var(--card)}
.tbl th,.tbl td{border:2px solid var(--grid2);padding:6px 12px;text-align:center;font-weight:800}
.tbl th{background:var(--blue-soft)}
.tbl td.q{background:var(--hl);color:var(--on-hl)}
table.conv th,table.conv td{min-width:38px;padding:6px 4px;position:relative}
table.conv .ta{outline:2px solid var(--pitch);outline-offset:-3px}
table.conv .tb{background:var(--hl);color:var(--on-hl)}
table.conv td.z{color:var(--margin)}
table.conv td i{position:absolute;right:-4px;bottom:0;font-style:normal;color:var(--margin);font-weight:900}
.pose{font:500 17px/1.4 var(--font-m);background:var(--blue-soft);border-radius:12px;padding:10px 14px;display:inline-block;margin:8px 0;overflow-x:auto;max-width:100%}
.answer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.answer input{font:400 28px/1 var(--font-d);letter-spacing:.04em;width:7em;max-width:100%;padding:8px 12px 6px;border:3px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.answer input.small{width:3.4em;text-align:center}
.answer .u{font:800 18px var(--font-b);color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px;width:100%}
.choice{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font:800 17px var(--font-b);text-align:center;min-height:54px;transition:transform .1s,border-color .1s}
.choice:hover{border-color:var(--pitch)}
.choice.good{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--ko);background:var(--ko-soft);opacity:.7}
.fb{border-radius:14px;padding:12px 14px;font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.ko{background:var(--ko-soft);color:var(--ko)}
.fb .shout{font:400 34px/1 var(--font-d);letter-spacing:.05em}
.stars{display:inline-flex;gap:2px}.stars svg{width:22px;height:22px}
.star-on{fill:var(--hl);stroke:color-mix(in srgb,var(--hl) 55%,#000)}.star-off{fill:var(--line);stroke:var(--line)}
.corr{border:2px dashed var(--ok);border-radius:14px;padding:12px 14px;background:var(--card)}
.corr h3{color:var(--ok);margin-bottom:6px}
.corr .rep{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-weight:900}
.navrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.08)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.result{text-align:center;padding:24px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.board{background:var(--board);border-radius:14px;padding:14px 18px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;width:100%;max-width:360px;border:3px solid var(--hl)}
.board .tm{font:800 13px var(--font-b);color:#cfd8d2;letter-spacing:.08em;text-transform:uppercase}
.board .pts{font:400 64px/1 var(--font-d);color:var(--board-ink);text-shadow:0 0 12px color-mix(in srgb,var(--board-ink) 60%,transparent);font-variant-numeric:tabular-nums}
.board .dash2{font:400 40px var(--font-d);color:#cfd8d2}
.progress-dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.progress-dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.progress-dots i.ok{background:var(--ok)}.progress-dots i.ko{background:var(--ko)}.progress-dots i.cur{background:var(--hl);box-shadow:0 0 0 2px var(--ink)}
.foot{font-size:13px;color:var(--muted);text-align:center;font-weight:700}
@media (max-width:480px){.stats{gap:8px}.stat b{font-size:28px}.tiles{gap:4px}.tile{font-size:15px;border-radius:7px}.q{font-size:17px}.brand span{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="top"><div class="top-in">
  <button class="brand" id="home" aria-label="Accueil"><span id="logo"></span><span>Stade des Maths</span></button>
  <span class="sp"></span>
  <span class="score" id="xp" title="Points"></span>
  <button class="icon-btn" id="snd" aria-label="Son activé"></button>
</div></header>
<main id="app"></main>
<div class="confetti" id="conf" aria-hidden="true"></div>

<script>
/* ==========================================================
   Maths 6e — générateurs d'exercices (100 par thème, corrigés)
   Chaque exercice est fixé par une graine : l'exercice n°37 d'un
   thème est toujours le même, sur tous les téléphones.
   ========================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
class R{constructor(s){this.g=mulberry32(s)}f(){return this.g()}i(a,b){return a+Math.floor(this.g()*(b-a+1))}pick(a){return a[Math.floor(this.g()*a.length)]}shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(this.g()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}}
const rnd=x=>Math.round(x*1e6)/1e6;

/* ---------- nombres en lettres (orthographe recommandée, traits d'union) ---------- */
function lettres(n){
  const u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const d=['','','vingt','trente','quarante','cinquante','soixante'];
  const s100=n=>{if(n<20)return u[n];const t=Math.floor(n/10),o=n%10;
    if(t===7)return n===71?'soixante-et-onze':'soixante-'+u[n-60];
    if(t===9)return 'quatre-vingt-'+u[n-80];
    if(t===8)return o===0?'quatre-vingts':'quatre-vingt-'+u[o];
    return d[t]+(o===0?'':o===1?'-et-un':'-'+u[o])};
  const s1000=n=>{const c=Math.floor(n/100),r=n%100;let s='';if(c>0)s=c===1?'cent':u[c]+'-cent'+(r===0?'s':'');if(r>0)s+=(s?'-':'')+s100(r);return s};
  if(n===0)return 'zéro';
  const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000,p=[];
  if(m)p.push(m===1?'un-million':s1000(m)+'-millions');
  if(k)p.push(k===1?'mille':s1000(k).replace(/cents$/,'cent').replace(/vingts$/,'vingt')+'-mille');
  if(r)p.push(s1000(r));
  return p.join('-');
}
function classes(x){const s=String(x),parts=[];let rest=s;while(rest.length>3){parts.unshift(rest.slice(-3));rest=rest.slice(0,-3)}parts.unshift(rest);const nm=['unités','mille','millions'];return parts.map((p,i)=>`<b>${p}</b> (classe des ${nm[parts.length-1-i]})`).join(', ')}
function hl(x,p,upto){const s=String(x),L=s.length;let o='';for(let i=0;i<L;i++){const pos=L-1-i;if(i>0&&(L-i)%3===0)o+=' ';const on=upto?pos>=p:pos===p;o+=on?`<mark>${s[i]}</mark>`:s[i]}return `<span class="nb">${o}</span>`}
function poser(nums,op,res){const all=[...nums,res],d=Math.max(...all.map(decs));const st=all.map(x=>{const s=rnd(x).toFixed(d);return d?s.replace('.',','):s});const w=Math.max(...st.map(s=>s.length));const lines=st.slice(0,-1).map((s,i)=>(i===0?'  ':op+' ')+s.padStart(w));return `<pre class="pose">${lines.join('\n')}\n${'─'.repeat(w+2)}\n  ${st[st.length-1].padStart(w)}</pre>`}

const svg=(w,h,inner,vb)=>`<svg viewBox="${vb||`0 0 ${w} ${h}`}" role="img" aria-label="figure">${inner}</svg>`;

function vlabel(V,G,l,d=16){const dx=V[0]-G[0],dy=V[1]-G[1],L=Math.hypot(dx,dy)||1;return T(V[0]+dx/L*d,V[1]+dy/L*d+5,l)}
function sideLabel(P,Q,G,t,d=16){const mx=(P[0]+Q[0])/2,my=(P[1]+Q[1])/2,dx=mx-G[0],dy=my-G[1],L=Math.hypot(dx,dy)||1;return T(mx+dx/L*d,my+dy/L*d+5,t,'lbls')}
function polyFig(pts,names,opt={}){const G=[pts.reduce((s,p)=>s+p[0],0)/pts.length,pts.reduce((s,p)=>s+p[1],0)/pts.length];let s=Pg(pts,opt.fill?'ln shapef':'ln');const n=pts.length;
  (opt.ticks||[]).forEach(([i,k])=>{s+=tick(pts[i],pts[(i+1)%n],k||1)});

function regPoly(k,cx,cy,Rr){const p=[];for(let i=0;i<k;i++){const t=-Math.PI/2+i*2*Math.PI/k;p.push([cx+Rr*Math.cos(t),cy+Rr*Math.sin(t)])}return p}
function gradLine(nT,lab,k,l){const x0=24,dx=Math.min(30,560/nT),y=46,W=x0*2+dx*nT;let s=Ln(x0-14,y,W-4,y)+`<polygon class="pt" points="${W-4},${y} ${W-13},${y-5} ${W-13},${y+5}"/>`;

function polyomino(r,N,c0,c1,r0,r1,start){const set=new Set(),cells=[];const add=(x,y)=>{const k=x+','+y;if(!set.has(k)){set.add(k);cells.push([x,y])}};add(...start);let g=0;

function angFig(o){const cx=o.cx||170,cy=o.cy||150,L=o.L||130,P=(a,l)=>[cx+l*Math.cos(a*Math.PI/180),cy-l*Math.sin(a*Math.PI/180)];let s='';

function isoBox(a,b,c){const s=22,cx=s*.866,sy=s*.5,P=(x,y,z)=>[(x-y)*cx,(x+y)*sy-z*s];const pts=[];for(const x of[0,a])for(const y of[0,b])for(const z of[0,c])pts.push(P(x,y,z));

  return svg(0,0,g,`${mnX.toFixed(1)} ${mnY.toFixed(1)} ${(mxX-mnX).toFixed(1)} ${(mxY-mnY).toFixed(1)}`).replace('<svg ','<svg style="max-width:260px" ')}

/* =====================  NOMBRES ET CALCULS  ===================== */
function gEntiers(r,lv,n){
  const big=()=>lv===0?r.i(1000,99999):lv===1?r.i(100000,9999999):r.i(10000000,999999999);
  const zeros=x=>{const d=String(x).split('');for(let i=1;i<d.length;i++)if(r.f()<.3)d[i]='0';return +d.join('')};
  const POS=['unités','dizaines','centaines','unités de mille','dizaines de mille','centaines de mille','unités de millions','dizaines de millions','centaines de millions'];
  switch(n%7){
  case 0:{const x=zeros(big());return num(lv===0?`Au stade, le speaker annonce le nombre de spectateurs :<div class="say">${lettres(x)}</div>Écris ce nombre en chiffres.`:lv===1?`Une fédération sportive annonce son nombre de licenciés :<div class="say">${lettres(x)}</div>Écris ce nombre en chiffres.`:`Écris ce nombre en chiffres :<div class="say">${lettres(x)}</div>`,x,`On découpe le nombre en classes de trois chiffres : ${classes(x)}.<br>On écrit donc <b>${fmt(x)}</b>.`)}
  case 1:{const x=big(),L=String(x).length,p=r.i(0,L-1),d=Math.floor(x/10**p)%10;return num(`Dans le nombre <b>${fmt(x)}</b>, quel est le chiffre des <b>${POS[p]}</b> ?`,d,`On repère les rangs en partant de la droite : unités, dizaines, centaines, puis la classe des mille, puis celle des millions.<br>${hl(x,p)} → le chiffre des ${POS[p]} est <b>${d}</b>.`)}
  case 2:{const p=r.pick(lv===0?[1,2]:[1,2,3]),NM={1:'dizaines',2:'centaines',3:'milliers'},x=big(),a=Math.floor(x/10**p);return num(`Combien y a-t-il de <b>${NM[p]}</b> dans <b>${fmt(x)}</b> ?`,a,`On garde tous les chiffres jusqu'au chiffre des ${p===3?'unités de mille':NM[p]}, celui-ci compris :<br>${hl(x,p,true)} → il y a <b>${fmt(a)}</b> ${NM[p]}.`)}
  case 3:{const L=lv===0?4:lv===1?6:8,t=[];let tot=0;for(let p=L-1;p>=0;p--){const d=p===L-1?r.i(1,9):(r.f()<.35?0:r.i(1,9));if(d){t.push([d,p]);tot+=d*10**p}}
    const shown=lv===2?r.shuffle(t):t;return num(`Quel nombre est égal à :<div class="say">${shown.map(([d,p])=>`${d} × ${fmt(10**p)}`).join(' + ')}</div>`,tot,`On calcule chaque terme : ${t.map(([d,p])=>`${d} × ${fmt(10**p)} = ${fmt(d*10**p)}`).join(' ; ')}.<br>${lv===2?'On les remet dans l\'ordre des rangs, puis on ajoute : ':'On ajoute : '}<b>${fmt(tot)}</b>${t.length<L?' (les rangs absents valent 0)':''}.`)}
  case 4:{const x=big(),s=String(x).split(''),set=new Set([x]);let g=0;while(set.size<4&&g++<60){const t=s.slice(),i=r.i(0,t.length-1),j=r.i(0,t.length-1);[t[i],t[j]]=[t[j],t[i]];if(t[0]!=='0')set.add(+t.join(''))}
    [1,10,100].forEach(k=>{if(set.size<4)set.add(x-k)});const arr=[...set],mx=r.f()<.5,good=mx?Math.max(...arr):Math.min(...arr),sorted=arr.slice().sort((a,b)=>mx?b-a:a-b);
    return qcm(r,`Quel est le <b>plus ${mx?'grand':'petit'}</b> de ces nombres ?`,fmt(good),arr.filter(v=>v!==good).map(fmt),`Ils ont tous ${s.length} chiffres : on compare les chiffres un par un, en partant de la gauche.<br>${sorted.map(fmt).join(mx?' &gt; ':' &lt; ')}<br>Réponse : <b>${fmt(good)}</b>.`)}
  case 5:{const ps=lv===0?[1,2]:lv===1?[2,3]:[3,4,5],p=r.pick(ps),NM={1:'à la dizaine',2:'à la centaine',3:'au millier',4:'à la dizaine de mille',5:'à la centaine de mille'};let x=big();if(x<10**(p+1))x+=10**(p+1);
    const lo=Math.floor(x/10**p)*10**p,hi=lo+10**p,d=Math.floor(x/10**(p-1))%10,a=d>=5?hi:lo;
    return num(`Arrondis <b>${fmt(x)}</b> ${NM[p]}.`,a,`${fmt(x)} est compris entre ${fmt(lo)} et ${fmt(hi)}.<br>On regarde le chiffre juste à droite du rang demandé : c'est <b>${d}</b>. ${d>=5?'Il est supérieur ou égal à 5 : on arrondit au-dessus.':'Il est inférieur à 5 : on arrondit en dessous.'}<br>Arrondi : <b>${fmt(a)}</b>.`)}
  default:{const k=lv===0?r.i(2,4):lv===1?r.i(4,6):r.i(6,8),m=r.i(1,9),b=m*10**k+(lv===2?r.pick([0,0,10**(k-2)]):0);
    if(r.f()<.5)return num(`Quel nombre vient <b>juste après</b> ${fmt(b-1)} ?`,b,`On ajoute 1 : ${fmt(b-1)} + 1 = <b>${fmt(b)}</b>. Les 9 se transforment en 0 et on retient 1 au rang suivant.`);
    return num(`Quel nombre vient <b>juste avant</b> ${fmt(b)} ?`,b-1,`On enlève 1 : ${fmt(b)} − 1 = <b>${fmt(b-1)}</b>.`)}
  }
}

function gDecimaux(r,lv,n){
  switch(n%7){
  case 0:{const ip=r.i(lv===0?1:10,lv===0?99:999),ds=[r.i(0,9),r.i(0,9),r.i(1,9)],x=rnd(ip+ds[0]/10+ds[1]/100+ds[2]/1000);const o=[['dixièmes',ds[0]],['centièmes',ds[1]],['millièmes',ds[2]],['unités',ip%10]];if(ip>=10)o.push(['dizaines',Math.floor(ip/10)%10]);const[nm,d]=r.pick(o);
    return num(`Dans le nombre <b>${fmt(x)}</b>, quel est le chiffre des <b>${nm}</b> ?`,d,`Partie entière : ${ip}. Après la virgule on lit, dans l'ordre : les dixièmes (${ds[0]}), les centièmes (${ds[1]}), les millièmes (${ds[2]}).<br>Le chiffre des ${nm} est <b>${d}</b>.`)}
  case 1:{if(lv<2){const p=r.pick(lv===0?[1,2]:[2,3]);let a=r.i(1,lv===0?99:9999);if(a%10===0)a+=r.i(1,9);const x=rnd(a/10**p);

const jersey=(txt,num,cls='jersey')=>`<svg class="${cls}" viewBox="0 0 60 56" aria-hidden="true"><path d="M19 3L8 8 2 21l9 4 2-4v32h34V21l2 4 9-4-6-13-11-5q-11 9-22 0z"/><path class="col" d="M22 4q8 6 16 0"/><text x="30" y="${num?37:36}" text-anchor="middle"${num?' style="font:400 24px var(--font-d)"':''}>${txt}</text></svg>`;
const SND_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',SND_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';

/* ===================== sons (fanfare et sifflet) et confettis ===================== */
let actx;function tone(f,t,d,type='triangle',vol=.18){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);return o}
function ctx(){if(!S.sound)return null;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();return actx}catch(e){return null}}
const sGood=()=>{const c=ctx();if(!c)return;let t=c.currentTime;[[523,.12],[659,.12],[784,.12],[1047,.3]].forEach(([f,d])=>{tone(f,t,d);t+=d*.8})};
const sBad=()=>{const c=ctx();if(!c)return;const t=c.currentTime;[0,.22].forEach(dt=>{const o=tone(2600,t+dt,.16,'sine',.08);const l=c.createOscillator(),lg=c.createGain();l.frequency.value=38;lg.gain.value=180;l.connect(lg).connect(o.frequency);l.start(t+dt);l.stop(t+dt+.2)})};
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('#conf'),cols=['var(--hl)','#ffffff','var(--pitch)','var(--margin)','var(--d-nb)'];for(let i=0;i<28;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cols[i%5];e.style.animationDelay=Math.random()*.3+'s';e.style.transform=`rotate(${Math.random()*180}deg)`;c.appendChild(e);setTimeout(()=>e.remove(),1800)}}

/* ===================== navigation ===================== */
let view={name:'home',dom:'all'};
function go(v){view=v;render();window.scrollTo(0,0)}
function updateTop(){const t=totals();$('#xp').innerHTML=`${t.xp}<small>PTS</small>`;$('#logo').innerHTML=BALL[S.sport];$('#snd').innerHTML=S.sound?SND_ON:SND_OFF;$('#snd').setAttribute('aria-label',S.sound?'Couper le son':'Activer le son')}
$('#home').onclick=()=>go({name:'home',dom:view.dom||'all'});
$('#snd').onclick=()=>{S.sound=!S.sound;save();updateTop()};
function render(){({home:rHome,theme:rTheme,ex:rEx,result:rResult})[view.name]();updateTop()}
const backBtn=(lbl,fn)=>{const b=document.createElement('button');b.className='back';b.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>${lbl}`;b.onclick=fn;return b};

/* ===================== accueil ===================== */
function badgesList(t){const doms=new Set();for(const th of THEMES)if(themeDone(th).d>0)doms.add(th.dom);const full=THEMES.some(th=>themeDone(th).d===100),f=S.sport==='foot';
  return[['1','Coup d\'envoi','1 exercice réussi',t.done>=1],['25','Échauffé','25 exercices réussis',t.done>=25],['100','100 sélections','100 exercices réussis',t.done>=100],['3',f?'Coup du chapeau':'Triplé d\'essais','5 bonnes réponses d\'affilée',S.best>=5],['10','Inarrêtable','10 d\'affilée',S.best>=10],['4','Polyvalent','Un exercice dans chaque domaine',doms.size===4],['30',f?'Ballon d\'or':'Meilleur marqueur','30 exercices à 3 étoiles',t.three>=30],['10/10','Grand chelem','10/10 au '+W().defiShort,S.defiBest>=10],['★','Champion','100/100 dans un thème',full]]}
function rHome(){const t=totals(),L=level(t.xp),dom=view.dom||'all',w=W();
  app.innerHTML=`
  <section class="hello">${mascot()}
    <div><h1>Salut <input id="pseudo" placeholder="ton prénom" maxlength="16" value="${(S.name||'').replace(/"/g,'&quot;')}" aria-label="Ton prénom"> !</h1><p class="muted">Entre sur le terrain : chaque bonne réponse fait marquer ${w.team}.</p>
    <div class="sport" role="group" aria-label="Ton sport"><button data-s="foot" aria-pressed="${S.sport==='foot'}">${BALL.foot}Foot</button><button data-s="rugby" aria-pressed="${S.sport==='rugby'}">${BALL.rugby}Rugby</button></div></div></section>
  <section class="card level">${jersey(L.title.length>4?L.l:L.title,true,'jersey').replace('<svg','<svg style="--c:var(--pitch);grid-row:span 2;width:62px;height:58px"')}<div><b style="font:400 26px/1 var(--font-d);letter-spacing:.03em">Catégorie ${L.title}</b> <span class="muted" style="font-size:13px;font-weight:800">encore ${L.need} pts pour monter</span></div><div class="bar" role="progressbar" aria-valuenow="${Math.round(L.pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${L.pct}%"></i></div></section>
  <section class="stats"><div class="card stat"><b>${t.stars}</b><span>étoiles</span></div><div class="card stat"><b>${t.done}<small class="muted" style="font:800 13px var(--font-b)"> / ${THEMES.length*100}</small></b><span>exercices réussis</span></div><div class="card stat"><b>${S.best}</b><span>meilleure série</span></div></section>
  <div class="cta"><button class="btn hl" id="defi">${w.defi}</button></div>
  <nav class="doms" aria-label="Domaines">${[['all','Tout','var(--ink)'],...DOMAINS.map(d=>[d.id,d.short,DCOL[d.id]])].map(([id,n,c])=>`<button class="chip" style="--c:${c}" data-d="${id}" aria-pressed="${dom===id}">${n}</button>`).join('')}</nav>
  ${DOMAINS.filter(d=>dom==='all'||dom===d.id).map(d=>`<section style="display:flex;flex-direction:column;gap:10px"><h2 class="dom-h" style="--c:${DCOL[d.id]}">${d.name}</h2><div class="themes">${THEMES.filter(x=>x.dom===d.id).map(x=>{const p=themeDone(x);return `<button class="card th" style="--c:${DCOL[d.id]}" data-t="${x.id}">${jersey(x.g)}<h3>${x.name}</h3><p>${x.desc}</p><span class="mini"><span class="bar"><i style="width:${p.d}%"></i></span>${p.d}/100</span></button>`}).join('')}</div></section>`).join('')}
  <section style="display:flex;flex-direction:column;gap:10px"><h2>Trophées</h2><div class="badges">${badgesList(t).map(([m,n,d,on])=>`<div class="card badge ${on?'':'off'}"><span class="medal">${m}</span><span><b>${n}</b>${d}</span></div>`).join('')}</div></section>
  <p class="foot">Programme de 6e · cycle 3 · ${THEMES.length} thèmes × 100 exercices corrigés. La progression est enregistrée sur cet appareil.</p>`;
  $('#pseudo').oninput=e=>{S.name=e.target.value.trim();save()};
  app.querySelectorAll('.sport button').forEach(b=>b.onclick=()=>{S.sport=b.dataset.s;save();rHome();updateTop()});
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{view.dom=b.dataset.d;rHome()});
  app.querySelectorAll('.th').forEach(b=>b.onclick=()=>go({name:'theme',t:b.dataset.t,dom}));
  $('#defi').onclick=()=>startDefi(null);
}

/* ===================== page thème ===================== */
const TH=id=>THEMES.find(t=>t.id===id);
function rTheme(){const t=TH(view.t),p=themeDone(t),c=DCOL[t.dom],next=(()=>{for(let n=1;n<=100;n++)if(stOf(t.id,n)<=0)return n;return 1})(),w=W();
  app.innerHTML=`<div class="navrow" id="nb"></div>
  <section class="thead" style="--c:${c}">${jersey(t.g)}<div><h1>${t.name}</h1><p class="muted" style="margin:2px 0 0;font-weight:700">${t.desc}</p></div></section>
  <div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:8px;--c:${c}"><div class="mini" style="font-size:14px"><span class="bar"><i style="width:${p.d}%"></i></span>${p.d}/100 réussis · ${p.s} étoiles</div></div>
  <div class="tip"><b>Consigne du coach.</b> ${t.tip}</div>
  <div class="cta"><button class="btn" id="cont">${p.d?'Reprendre le match':'Coup d\'envoi'} · exercice ${next}</button><button class="btn ghost" id="dft">${S.sport==='foot'?'Tirs au but':'Match éclair'} · 10 questions</button></div>
  ${[['Facile',1,33,'l0'],['Moyen',34,66,'l1'],['Difficile',67,100,'l2']].map(([nm,a,b,cl])=>`<section class="card" style="padding:14px"><div class="lvl-h"><h2>${nm}</h2><span class="tag ${cl}">exercices ${a} à ${b}</span></div><div class="tiles">${Array.from({length:b-a+1},(_,i)=>{const n=a+i,s=stOf(t.id,n);return `<button class="tile ${s===3?'s3':s===2?'s2':s===1?'s1':s<0?'sv':''}" data-n="${n}" aria-label="Exercice ${n}${s>0?', '+s+' étoiles':s<0?', corrigé consulté':''}">${n}</button>`}).join('')}</div></section>`).join('')}
  <div class="legend"><span><i style="background:var(--ok);border-color:var(--ok)"></i>3 étoiles</span><span><i style="background:color-mix(in srgb,var(--ok) 55%,var(--card));border-color:var(--ok)"></i>2 étoiles</span><span><i style="background:var(--hl)"></i>1 étoile</span><span><i style="background:var(--ko-soft);border-color:var(--ko)"></i>corrigé lu, à rejouer</span></div>`;
  $('#nb').appendChild(backBtn('Thèmes',()=>go({name:'home',dom:view.dom||'all'})));
  $('#cont').onclick=()=>openEx(t.id,next);$('#dft').onclick=()=>startDefi(t.id);
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>openEx(t.id,+b.dataset.n));
}

/* ===================== exercice ===================== */
let cur=null;
function openEx(tid,n,defi){cur={tid,n,tries:0,done:false,seen:false,ok:false,defi:defi||null};go({name:'ex',t:tid,dom:view.dom})}
function parseNum(s){s=String(s).trim().replace(/[\s  ]/g,'').replace(/−/g,'-').replace(',','.');if(!/^-?\d*\.?\d+$/.test(s)&&!/^-?\d+\.$/.test(s))return NaN;return parseFloat(s)}
function ansText(ex){if(ex.kind==='hm'){const L=ex.labels||['h','min'];return `${ex.ans[0]} ${L[0]} ${ex.ans[1]} ${L[1]}`}if(ex.kind==='qcm')return ex.ans;return fmt(ex.ans)+(ex.unit?' '+ex.unit:'')}
function rEx(){const t=TH(cur.tid),ex=getExercises(t)[cur.n-1],c=DCOL[t.dom],lvTxt=['Facile','Moyen','Difficile'][ex.lv],best=stOf(t.id,cur.n),d=cur.defi,w=W();
  app.innerHTML=`<div class="navrow" id="nb"></div>
  <div class="exhead"><span class="tag" style="color:${c};border-color:${c}">${t.name}</span><span class="tag l${ex.lv}">${lvTxt}</span>${best>0&&!d?stars(best):''}</div>
  ${d?`<div class="progress-dots">${d.list.map((_,i)=>`<i class="${i<d.i?(d.res[i]?'ok':'ko'):i===d.i?'cur':''}"></i>`).join('')}</div>`:''}
  <article class="card sheet" id="sheet"><div class="exnum">${d?`${w.q} ${d.i+1} / 10 · `:''}Exercice ${ex.n} / 100</div><div class="q">${ex.q}</div>${ex.fig?`<div class="fig">${ex.fig}</div>`:''}
    <form class="answer" id="form" autocomplete="off">${ex.kind==='num'?`<input id="in1" inputmode="decimal" placeholder="Réponse" aria-label="Ta réponse">${ex.unit?`<span class="u">${ex.unit}</span>`:''}<button class="btn" type="submit">Valider</button>`:ex.kind==='hm'?`<input id="in1" class="small" inputmode="numeric" aria-label="${(ex.labels||['heures'])[0]}"><span class="u">${(ex.labels||['h'])[0]}</span><input id="in2" class="small" inputmode="numeric" aria-label="${(ex.labels||['','minutes'])[1]}"><span class="u">${(ex.labels||['','min'])[1]}</span><button class="btn" type="submit">Valider</button>`:`<div class="choices">${ex.choices.map((ch,i)=>`<button type="button" class="choice" data-i="${i}">${ch}</button>`).join('')}</div>`}</form>
  </article>
  <div id="fb"></div><div id="corr"></div>
  <div class="navrow" id="bot"></div>`;
  $('#nb').appendChild(backBtn(d?'Quitter le match':t.name,()=>d?go({name:'home',dom:view.dom||'all'}):go({name:'theme',t:t.id,dom:view.dom})));
  const bot=$('#bot');
  const mk=(txt,cls,fn,id)=>{const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=txt;b.onclick=fn;if(id)b.id=id;return b};
  if(!d){bot.append(mk('← Précédent','ghost',()=>openEx(t.id,Math.max(1,cur.n-1))),mk('Voir le corrigé','ghost',()=>showCorr(ex),'bc'),mk('Suivant →','',()=>openEx(t.id,cur.n<100?cur.n+1:1),'bn'))}
  const form=$('#form');
  if(ex.kind==='qcm'){form.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(cur.done)return;const ok=ex.choices[+b.dataset.i]===ex.ans;answer(ex,ok,b)})}
  else{form.onsubmit=e=>{e.preventDefault();if(cur.done)return;let ok;if(ex.kind==='num'){const v=parseNum($('#in1').value);if(isNaN(v)){hint('Écris un nombre (avec une virgule si besoin).');return}ok=Math.abs(v-ex.ans)<1e-6}else{const h=parseNum($('#in1').value),m=parseNum($('#in2').value||'0');if(isNaN(h)||isNaN(m)){hint('Remplis les deux cases avec des nombres.');return}ok=h===ex.ans[0]&&m===ex.ans[1]}answer(ex,ok)};setTimeout(()=>{try{$('#in1').focus({preventScroll:true})}catch(e){}},50)}
}
function hint(msg){$('#fb').innerHTML=`<div class="fb ko">${msg}</div>`}
function showCorr(ex,auto){cur.seen=true;$('#corr').innerHTML=`<section class="corr"><h3>Corrigé du coach</h3><div>${ex.corr}</div><div class="rep">Réponse : ${ansText(ex)}</div></section>`;
  if(!cur.ok&&!cur.defi){const p=prog(cur.tid);if(!p[cur.n])p[cur.n]=-1;save()}const b=$('#bc');if(b)b.remove();if(!auto)$('#corr').scrollIntoView({behavior:'smooth',block:'nearest'})}
function answer(ex,ok,btn){cur.tries++;const d=cur.defi,max=ex.kind==='qcm'&&ex.choices.length<=2?1:2,w=W();
  if(ok){cur.done=cur.ok=true;const k=cur.seen?0:cur.tries===1?3:cur.tries===2?2:1;if(btn)btn.classList.add('good');
    if(cur.tries===1&&!cur.seen){S.streak++;S.best=Math.max(S.best,S.streak)}else S.streak=0;
    const p=prog(cur.tid),old=p[cur.n]>0?p[cur.n]:0;if(k>old)p[cur.n]=k;else if(!p[cur.n])p[cur.n]=k||-1;save();
    const msg=['Bonne réponse, mais après le corrigé : rejoue-le plus tard pour gagner des étoiles.','Bien joué !',`Réussi ${w.m2} !`,`Du premier coup, ${w.m3} !`][k];
    $('#fb').innerHTML=`<div class="fb ok pop">${k?`<span class="shout">${w.shout[k]}</span>`+stars(k):''}<span>${msg}${k>old?` +${(k-old)*5} pts`:''}${S.streak>=3?` · série de ${S.streak}`:''}</span></div>`;sGood();if(k===3)confetti();
    if(d)d.res[d.i]=true}
  else{sBad();S.streak=0;$('#sheet').classList.remove('shake');void $('#sheet').offsetWidth;$('#sheet').classList.add('shake');if(btn){btn.classList.add('bad');btn.disabled=true}
    if(d||cur.tries>=max){cur.done=true;$('#fb').innerHTML=`<div class="fb ko"><span class="shout">${w.shout[0]}</span><span>Ce n'est pas ça. Lis le corrigé du coach, puis rejoue l'exercice plus tard.</span></div>`;if(d)d.res[d.i]=false;showCorr(ex,true);
      if(ex.kind==='qcm')document.querySelectorAll('.choice').forEach(b=>{if(ex.choices[+b.dataset.i]===ex.ans)b.classList.add('good')})}
    else $('#fb').innerHTML=`<div class="fb ko">Raté de peu… Relis bien l'énoncé et retente ta chance !</div>`}
  save();updateTop();
  if(cur.done){document.querySelectorAll('#form input,#form button').forEach(e=>e.disabled=true);
    if(d){const bot=$('#bot');bot.innerHTML='';if(!$('#corr').innerHTML){const b=document.createElement('button');b.className='btn ghost';b.textContent='Voir le corrigé';b.onclick=()=>{showCorr(ex);b.remove()};bot.append(b)}const n=document.createElement('button');n.className='btn';n.textContent=d.i<9?`${w.q} suivant${S.sport==='foot'?'':'e'} →`:'Coup de sifflet final';n.onclick=()=>{d.i++;if(d.i>=10){go({name:'result',dom:view.dom})}else openEx(d.list[d.i].t,d.list[d.i].n,d)};bot.append(n)}
    else{const bn=$('#bn');if(bn){bn.classList.add('pop')}}}
}

/* ===================== match éclair / tirs au but ===================== */
function startDefi(tid){const list=[];const used=new Set();while(list.length<10){const t=tid?TH(tid):THEMES[Math.floor(Math.random()*THEMES.length)],n=1+Math.floor(Math.random()*100),k=t.id+n;if(!used.has(k)){used.add(k);list.push({t:t.id,n})}}
  const d={list,i:0,res:[],tid};openEx(list[0].t,list[0].n,d)}
function rResult(){const d=cur.defi,sc=d.res.filter(Boolean).length,w=W(),[a,b]=w.pts(sc,10-sc);S.defiBest=Math.max(S.defiBest||0,sc);save();if(a>b)confetti();
  const msg=sc===10?'Grand chelem ! Score parfait.':a>b?'Victoire ! Belle performance.':a===b?'Match nul : encore un petit effort !':'Défaite cette fois : relis les corrigés et prends ta revanche.';
  app.innerHTML=`<section class="card result"><h1>Coup de sifflet final</h1><div class="board"><div><div class="tm">${w.me}</div><div class="pts">${a}</div></div><div class="dash2">–</div><div><div class="tm">${w.opp}</div><div class="pts">${b}</div></div></div>
  <div class="progress-dots">${d.res.map(r=>`<i class="${r?'ok':'ko'}"></i>`).join('')}</div><p style="font-weight:800">${msg}</p><p class="muted">${sc} bonne${sc>1?'s':''} réponse${sc>1?'s':''} sur 10${S.sport==='rugby'?' (5 points par essai, 3 points pour l\'adversaire à chaque erreur)':''} · record : ${S.defiBest} / 10</p><div class="cta" style="justify-content:center"><button class="btn" id="again">Revanche</button><button class="btn ghost" id="bh">${d.tid?'Retour au thème':'Accueil'}</button></div></section>`;
  $('#again').onclick=()=>startDefi(d.tid);$('#bh').onclick=()=>d.tid?go({name:'theme',t:d.tid,dom:view.dom}):go({name:'home',dom:view.dom||'all'})}

render();
</script>

<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body>
